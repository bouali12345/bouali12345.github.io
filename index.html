<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Tunisia AI</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root { --sand:#E8D5A3; --terra:#C4622D; --night:#0D1117; --gold:#D4A017; --turq:#2A9D8F; --cream:#FAF3E0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Cairo',sans-serif; background:var(--night); color:var(--cream); overflow-x:hidden; }
  .lang-bar { position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(13,17,23,0.96); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.07); display:flex; justify-content:center; gap:0.5rem; padding:0.6rem 1rem; }
  .lang-btn { background:transparent; border:1px solid rgba(255,255,255,0.15); color:rgba(250,243,224,0.6); padding:0.3rem 1rem; border-radius:50px; font-size:0.85rem; cursor:pointer; transition:all 0.2s; font-family:inherit; }
  .lang-btn.active, .lang-btn:hover { background:var(--terra); border-color:var(--terra); color:white; }
  .hero { min-height:100vh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:7rem 2rem 4rem; overflow:hidden; }
  .hero::before { content:''; position:absolute; inset:0; z-index:0; background: radial-gradient(ellipse at 20% 50%, rgba(196,98,45,0.25) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(42,157,143,0.15) 0%, transparent 50%); }
  .mosaic-bg { position:absolute; inset:0; opacity:0.04; z-index:0; background-image: repeating-linear-gradient(45deg, var(--gold) 0,var(--gold) 1px, transparent 1px, transparent 20px), repeating-linear-gradient(-45deg, var(--terra) 0,var(--terra) 1px, transparent 1px, transparent 20px); }
  .hero-content { position:relative; z-index:1; max-width:800px; }
  .badge { display:inline-block; background:rgba(212,160,23,0.12); border:1px solid rgba(212,160,23,0.35); color:var(--gold); padding:0.4rem 1.2rem; border-radius:50px; font-size:0.82rem; letter-spacing:2px; margin-bottom:2rem; animation:fadeDown 0.7s ease both; }
  .hero h1 { font-size:clamp(2.8rem,9vw,6.5rem); line-height:1.1; margin-bottom:1rem; animation:fadeUp 0.8s ease 0.2s both; }
  .hero h1 .line1 { display:block; color:var(--cream); }
  .hero h1 .line2 { display:block; color:var(--terra); }
  .hero h1 .line3 { display:block; color:var(--gold); font-size:0.5em; font-weight:300; margin-top:0.3em; }
  .hero-sub { font-size:1.1rem; color:rgba(250,243,224,0.65); max-width:520px; margin:0 auto 2.5rem; line-height:1.9; animation:fadeUp 0.8s ease 0.4s both; }
  .hero-buttons { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; animation:fadeUp 0.8s ease 0.6s both; }
  .btn-primary { background:var(--terra); color:white; border:none; padding:0.9rem 2.2rem; border-radius:50px; font-family:'Cairo',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; transition:all 0.3s; text-decoration:none; display:inline-block; }
  .btn-primary:hover { background:#d4703a; transform:translateY(-2px); }
  .btn-secondary { background:transparent; color:var(--gold); border:1px solid rgba(212,160,23,0.45); padding:0.9rem 2.2rem; border-radius:50px; font-family:'Cairo',sans-serif; font-size:1rem; cursor:pointer; transition:all 0.3s; text-decoration:none; display:inline-block; }
  .btn-secondary:hover { background:rgba(212,160,23,0.1); transform:translateY(-2px); }
  .chat-section { padding:4rem 1.5rem; max-width:800px; margin:0 auto; }
  .section-title { text-align:center; margin-bottom:2.5rem; }
  .section-title h2 { font-size:clamp(1.8rem,4vw,3rem); color:var(--sand); margin-bottom:0.4rem; }
  .section-title p { color:rgba(250,243,224,0.55); font-size:0.95rem; }
  .chat-container { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:20px; overflow:hidden; }
  .chat-messages { min-height:280px; max-height:380px; overflow-y:auto; padding:1.5rem; display:flex; flex-direction:column; gap:1rem; }
  .chat-messages::-webkit-scrollbar { width:4px; }
  .chat-messages::-webkit-scrollbar-thumb { background:rgba(212,160,23,0.3); border-radius:2px; }
  .message { max-width:82%; padding:0.9rem 1.2rem; border-radius:16px; font-size:0.93rem; line-height:1.75; animation:msgIn 0.3s ease; }
  .message.ai { background:rgba(196,98,45,0.13); border:1px solid rgba(196,98,45,0.2); align-self:flex-start; border-radius:16px 16px 16px 4px; }
  .message.user { background:rgba(42,157,143,0.13); border:1px solid rgba(42,157,143,0.2); align-self:flex-end; border-radius:16px 16px 4px 16px; }
  .message.loading { background:rgba(196,98,45,0.08); border:1px solid rgba(196,98,45,0.12); align-self:flex-start; color:rgba(250,243,224,0.45); font-style:italic; }
  .quick-questions { padding:0 1.5rem 1rem; display:flex; flex-wrap:wrap; gap:0.5rem; }
  .quick-q { background:rgba(212,160,23,0.07); border:1px solid rgba(212,160,23,0.18); color:var(--gold); padding:0.35rem 0.85rem; border-radius:50px; font-size:0.78rem; cursor:pointer; transition:all 0.2s; font-family:'Cairo',sans-serif; }
  .quick-q:hover { background:rgba(212,160,23,0.14); transform:translateY(-1px); }
  .chat-input-area { border-top:1px solid rgba(255,255,255,0.07); padding:1rem 1.5rem; display:flex; gap:0.8rem; align-items:center; }
  .chat-input { flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:0.75rem 1.1rem; color:var(--cream); font-family:'Cairo',sans-serif; font-size:0.93rem; outline:none; transition:border-color 0.3s; }
  .chat-input::placeholder { color:rgba(250,243,224,0.28); }
  .chat-input:focus { border-color:rgba(212,160,23,0.4); }
  .send-btn { background:var(--terra); border:none; border-radius:12px; width:44px; height:44px; cursor:pointer; font-size:1.1rem; transition:all 0.3s; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .send-btn:hover { background:#d4703a; transform:scale(1.05); }
  .send-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
  .features { padding:4rem 1.5rem; max-width:1100px; margin:0 auto; }
  .features-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1.2rem; margin-top:2.5rem; }
  .feature-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:1.8rem; transition:all 0.3s; position:relative; overflow:hidden; }
  .feature-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--terra),var(--gold)); opacity:0; transition:opacity 0.3s; }
  .feature-card:hover { transform:translateY(-4px); }
  .feature-card:hover::before { opacity:1; }
  .feature-icon { font-size:2.2rem; margin-bottom:0.8rem; display:block; }
  .feature-card h3 { font-size:1.1rem; font-weight:700; color:var(--sand); margin-bottom:0.5rem; }
  .feature-card p { color:rgba(250,243,224,0.55); font-size:0.88rem; line-height:1.75; }
  .pay-section { padding:3rem 1.5rem; max-width:580px; margin:0 auto; }
  .pay-card { background:rgba(212,160,23,0.07); border:1px solid rgba(212,160,23,0.2); border-radius:20px; padding:2.5rem; text-align:center; }
  .pay-icon { font-size:2.5rem; margin-bottom:1rem; }
  .pay-card h2 { font-size:1.6rem; color:var(--sand); margin-bottom:0.6rem; }
  .pay-card p { color:rgba(250,243,224,0.55); font-size:0.9rem; margin-bottom:1.5rem; line-height:1.7; }
  .pay-btn { background:var(--gold); color:#1A0A00; border:none; padding:1rem 2.5rem; border-radius:50px; font-family:'Cairo',sans-serif; font-size:1.1rem; font-weight:900; cursor:pointer; transition:all 0.3s; width:100%; }
  .pay-btn:hover { background:#e6b020; transform:translateY(-2px); box-shadow:0 10px 30px rgba(212,160,23,0.3); }
  .pay-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .pay-status { margin-top:1rem; font-size:0.9rem; color:rgba(250,243,224,0.5); min-height:1.5rem; }
  footer { text-align:center; padding:2.5rem 1.5rem; border-top:1px solid rgba(255,255,255,0.06); color:rgba(250,243,224,0.28); font-size:0.82rem; }
  footer span { color:var(--terra); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:translateY(0)} }
  @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  body.ltr { direction:ltr; }
  body.ltr .chat-input { text-align:left; direction:ltr; }
</style>
</head>

};

let currentLang = 'ar';
let history = [];

function setLang(lang, btn) {
  currentLang = lang;
  const t = T[lang];
  document.documentElement.setAttribute('lang', t.langAttr);
  document.documentElement.setAttribute('dir', t.dir);
  document.body.className = t.dir === 'ltr' ? 'ltr' : '';
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('hero-badge').textContent = t.badge;
  document.getElementById('hero-line1').textContent = t.line1;
  document.getElementById('hero-line2').textContent = t.line2;
  document.getElementById('hero-line3').textContent = t.line3;
  document.getElementById('hero-sub').textContent = t.sub;
  document.getElementById('btn-start').textContent = t.btnStart;
  document.getElementById('btn-more').textContent = t.btnMore;
  document.getElementById('chat-title').textContent = t.chatTitle;
  document.getElementById('chat-sub').textContent = t.chatSub;
  document.getElementById('chatInput').placeholder = t.placeholder;
  document.getElementById('feat-title').textContent = t.featTitle;
  document.getElementById('feat-sub').textContent = t.featSub;
  document.getElementById('footer-text').innerHTML = t.footer;
  document.getElementById('pay-title').textContent = t.payTitle;
  document.getElementById('pay-desc').textContent = t.payDesc;
  document.getElementById('pay-btn-text').textContent = t.payBtn;
  document.getElementById('pay-status').textContent = '';
  history = [];
  document.getElementById('chatMessages').innerHTML = `<div class="message ai">🤖 ${t.welcome}</div>`;
  document.getElementById('quickQuestions').innerHTML = t.quickQs.map(q =>
    `<button class="quick-q" onclick="ask('${q.text.replace(/'/g,"&#39;")}')">${q.icon} ${q.text}</button>`
  ).join('');
  document.getElementById('featuresGrid').innerHTML = t.features.map(f =>
    `<div class="feature-card"><span class="feature-icon">${f.icon}</span><h3>${f.title}</h3><p>${f.desc}</p></div>`
  ).join('');
}

async function sendMessage() {
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  await ask(text);
}

async function ask(text) {
  const t = T[currentLang];
  const msgs = document.getElementById('chatMessages');
  const btn = document.getElementById('sendBtn');
  msgs.innerHTML += `<div class="message user">${text}</div>`;
  msgs.scrollTop = msgs.scrollHeight;
  const lid = 'l' + Date.now();
  msgs.innerHTML += `<div class="message loading" id="${lid}">⏳ ...</div>`;
  msgs.scrollTop = msgs.scrollHeight;
  btn.disabled = true;
  history.push({role:'user', content:text});
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, system:t.systemPrompt, messages:history })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || '...';
    history.push({role:'assistant', content:reply});
    document.getElementById(lid).remove();
    msgs.innerHTML += `<div class="message ai">🤖 ${reply}</div>`;
  } catch(e) {
    document.getElementById(lid).remove();
    msgs.innerHTML += `<div class="message ai">⚠️ Error</div>`;
  }
  btn.disabled = false;
  msgs.scrollTop = msgs.scrollHeight;
}

async function payWithPi() {
  const t = T[currentLang];
  const btn = document.getElementById('payBtn');
  const status = document.getElementById('pay-status');
  btn.disabled = true;
  status.textContent = t.payProcessing;
  status.style.color = 'rgba(250,243,224,0.5)';
  try {
    if (!window.Pi) {
      status.textContent = t.payBrowser;
      btn.disabled = false;
      return;
    }
    window.Pi.init({ version: "2.0", sandbox: true });
    await window.Pi.createPayment({
      amount: 1,
      memo: "Discover Tunisia AI - Support",
      metadata: { app: "discover-tunisia-ai" }
    }, {
      onReadyForServerApproval: function(paymentId) {
        console.log("Approval:", paymentId);
      },
      onReadyForServerCompletion: function(paymentId, txid) {
        status.textContent = t.paySuccess;
        status.style.color = '#2A9D8F';
        btn.disabled = false;
      },
      onCancel: function() {
        status.textContent = t.payCancel;
        btn.disabled = false;
      },
      onError: function(err) {
        console.error(err);
        status.textContent = t.payError;
        btn.disabled = false;
      }
    });
  } catch(e) {
    status.textContent = t.payError;
    btn.disabled = false;
  }
}

setLang('ar', document.querySelector('.lang-btn'));
</script>
</body>
</html>
